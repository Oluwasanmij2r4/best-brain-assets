<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pattern for warty zygospore wall -->
    <pattern id="zygosporeTexture" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#523924" />
      <circle cx="4" cy="4" r="2.2" fill="#2b1a0d" />
      <circle cx="11" cy="10" r="2.5" fill="#1f1207" />
      <circle cx="10" cy="3" r="1.8" fill="#382413" />
      <circle cx="3" cy="11" r="1.8" fill="#382413" />
    </pattern>

    <!-- Marker for leader arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111" />
    </marker>
  </defs>

  <!-- ================= STAGE 1: Top-Left (Progametangia Contact) ================= -->
  <g id="stage1">
    <!-- Left hypha with progametangium (+) -->
    <path d="M 50 155 C 50 120, 75 100, 115 95 C 130 93, 140 98, 148 106 C 140 115, 125 118, 110 118 C 85 118, 70 130, 70 155 Z" 
          fill="#fdfbf7" stroke="#222" stroke-width="2.5" />
    
    <!-- Right hypha with progametangium (-) -->
    <path d="M 230 155 C 230 120, 205 100, 165 95 C 150 93, 140 98, 132 106 C 140 115, 155 118, 170 118 C 195 118, 210 130, 210 155 Z" 
          fill="#fdfbf7" stroke="#222" stroke-width="2.5" />

    <!-- Septa separating progametangia -->
    <line x1="128" y1="96" x2="128" y2="116" stroke="#444" stroke-width="1.8" stroke-dasharray="2,2" />
    <line x1="152" y1="96" x2="152" y2="116" stroke="#444" stroke-width="1.8" stroke-dasharray="2,2" />

    <!-- Nuclei granules inside tip cells -->
    <circle cx="136" cy="103" r="1.5" fill="#333" />
    <circle cx="144" cy="105" r="1.5" fill="#333" />
    <circle cx="138" cy="110" r="1.5" fill="#333" />
    <circle cx="146" cy="112" r="1.5" fill="#333" />

    <!-- Strain designations -->
    <text x="125" y="82" font-size="16" font-weight="bold" fill="#333">+</text>
    <text x="155" y="82" font-size="18" font-weight="bold" fill="#333">−</text>
  </g>

  <!-- ================= STAGE 2: Top-Right (Gametangia Fusion) ================= -->
  <g id="stage2">
    <!-- Left suspensor hypha -->
    <path d="M 305 170 C 305 130, 335 110, 380 108 L 380 132 C 348 134, 328 145, 328 170 Z" 
          fill="#fdfbf7" stroke="#222" stroke-width="2.5" />

    <!-- Right suspensor hypha -->
    <path d="M 535 170 C 535 130, 505 110, 460 108 L 460 132 C 492 134, 512 145, 512 170 Z" 
          fill="#fdfbf7" stroke="#222" stroke-width="2.5" />

    <!-- Septa separating suspensors from gametangia -->
    <line x1="380" y1="108" x2="380" y2="132" stroke="#222" stroke-width="2" stroke-dasharray="2,2" />
    <line x1="460" y1="108" x2="460" y2="132" stroke="#222" stroke-width="2" stroke-dasharray="2,2" />

    <!-- Fusing Gametangia (Central developing block) -->
    <rect x="380" y="104" width="80" height="32" rx="6" fill="#ded2bc" stroke="#222" stroke-width="2" />
    
    <!-- Multi-nucleated/developing texture within fused gametangia -->
    <g fill="#443220">
      <circle cx="395" cy="115" r="3.5" />
      <circle cx="410" cy="112" r="3.5" />
      <circle cx="425" cy="115" r="3.5" />
      <circle cx="440" cy="112" r="3.5" />
      <circle cx="400" cy="126" r="3.5" />
      <circle cx="415" cy="124" r="3.5" />
      <circle cx="430" cy="126" r="3.5" />
      <circle cx="445" cy="123" r="3.5" />
    </g>

    <!-- Gametangia Label and Pointer -->
    <line x1="435" y1="65" x2="420" y2="100" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="440" y="60" font-size="18" font-weight="bold" fill="#111">Gametangia</text>

    <!-- Label I pointing to the Hypha / Suspensor -->
    <line x1="315" y1="205" x2="315" y2="175" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="310" y="225" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">I</text>
  </g>

  <!-- ================= STAGE 3: Bottom (Mature Zygospore) ================= -->
  <g id="stage3">
    <!-- Left suspensor hypha -->
    <path d="M 180 280 C 180 235, 210 215, 255 212 L 255 238 C 225 240, 205 252, 205 280 Z" 
          fill="#fdfbf7" stroke="#222" stroke-width="2.5" />

    <!-- Right suspensor hypha -->
    <path d="M 400 280 C 400 235, 370 215, 325 212 L 325 238 C 355 240, 375 252, 375 280 Z" 
          fill="#fdfbf7" stroke="#222" stroke-width="2.5" />

    <!-- Warty Zygospore central sphere -->
    <ellipse cx="290" cy="225" rx="55" ry="42" fill="url(#zygosporeTexture)" stroke="#1f1207" stroke-width="2.5" />

    <!-- Warts along perimeter -->
    <g fill="#2b1a0d">
      <circle cx="240" cy="210" r="5" />
      <circle cx="255" cy="192" r="5.5" />
      <circle cx="275" cy="185" r="5" />
      <circle cx="300" cy="184" r="5.5" />
      <circle cx="325" cy="192" r="5" />
      <circle cx="340" cy="210" r="5" />
      <circle cx="342" cy="235" r="5.5" />
      <circle cx="330" cy="255" r="5" />
      <circle cx="305" cy="266" r="5.5" />
      <circle cx="275" cy="265" r="5" />
      <circle cx="250" cy="252" r="5.5" />
      <circle cx="238" cy="230" r="5" />
    </g>
  </g>
</svg>
