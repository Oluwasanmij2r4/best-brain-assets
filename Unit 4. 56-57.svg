<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Dot Marker -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="3.5" fill="#111" />
    </marker>
  </defs>

  <!-- Long whip-like Flagellum extending from anterior gullet/reservoir -->
  <path d="M 172 135 
           C 172 100, 185 70, 240 60 
           C 310 50, 315 95, 230 115 
           C 130 135, 60 120, 50 145 
           C 40 170, 75 200, 68 235" 
        fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" />

  <!-- Euglena Body (Spindle / Fusiform shape) -->
  <path d="M 172 135 
           C 150 145, 125 180, 125 245 
           C 125 315, 165 375, 185 410 
           C 205 375, 245 315, 245 245 
           C 245 180, 220 145, 198 135 
           C 192 130, 178 130, 172 135 Z" 
        fill="#f6faf4" stroke="#222" stroke-width="2.5" />

  <!-- Anterior invagination / Reservoir / Gullet -->
  <path d="M 178 135 C 180 148, 182 160, 185 160 C 188 160, 190 148, 192 135" 
        fill="none" stroke="#333" stroke-width="1.8" />

  <!-- Structure I: Eyespot / Stigma (Red/dark spot near reservoir) -->
  <circle cx="177" cy="155" r="7.5" fill="#d93829" stroke="#222" stroke-width="1.5" />
  <circle cx="177" cy="155" r="3" fill="#ffffff" />

  <!-- Structure II: Contractile Vacuole (Adjacent to reservoir with accessory vacuoles/radiations) -->
  <g id="contractile-vacuole">
    <circle cx="192" cy="178" r="6" fill="#ffffff" stroke="#222" stroke-width="1.5" />
    <!-- Radiating droplets/canals -->
    <line x1="192" y1="168" x2="192" y2="164" stroke="#222" stroke-width="1.5" />
    <line x1="192" y1="188" x2="192" y2="192" stroke="#222" stroke-width="1.5" />
    <line x1="182" y1="178" x2="178" y2="178" stroke="#222" stroke-width="1.5" />
    <line x1="202" y1="178" x2="206" y2="178" stroke="#222" stroke-width="1.5" />
    <line x1="185" y1="171" x2="182" y2="168" stroke="#222" stroke-width="1.2" />
    <line x1="199" y1="185" x2="202" y2="188" stroke="#222" stroke-width="1.2" />
    <line x1="185" y1="185" x2="182" y2="188" stroke="#222" stroke-width="1.2" />
    <line x1="199" y1="171" x2="202" y2="168" stroke="#222" stroke-width="1.2" />
  </g>

  <!-- Structure III: Chloroplasts (Stellate / Star-shaped radiating bands with central pyrenoid) -->
  <g id="chloroplast-star">
    <!-- Star-shaped radiating chloroplast rays -->
    <path d="M 185 260 L 150 255 L 180 268 L 155 285 L 183 275 L 185 305 L 192 276 L 215 285 L 195 268 L 225 255 L 194 258 L 205 235 L 187 252 L 175 235 Z" 
          fill="#5ea853" stroke="#23601b" stroke-width="1.5" />
    <!-- Central paramylum / pyrenoid region -->
    <circle cx="187" cy="265" r="7.5" fill="#f8fcf5" stroke="#23601b" stroke-width="1.8" />
  </g>

  <!-- Paramylon granules scattered in cytoplasm -->
  <ellipse cx="145" cy="210" rx="3" ry="5" fill="#e2eddc" stroke="#444" stroke-width="1" />
  <ellipse cx="155" cy="325" rx="3.5" ry="6" fill="#e2eddc" stroke="#444" stroke-width="1" />
  <ellipse cx="220" cy="220" rx="3" ry="5.5" fill="#e2eddc" stroke="#444" stroke-width="1" />
  <ellipse cx="170" cy="205" rx="4" ry="2.5" fill="#e2eddc" stroke="#444" stroke-width="1" />

  <!-- Structure IV: Nucleus / Nucleolus near posterior end -->
  <circle cx="185" cy="355" r="9" fill="#ffffff" stroke="#222" stroke-width="1.8" />
  <circle cx="185" cy="355" r="3.5" fill="#222" />

  <!-- Pointers and Labels -->
  <!-- Label I: Eyespot / Stigma -->
  <line x1="330" y1="155" x2="185" y2="155" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="340" y="161" font-size="19" font-weight="bold" fill="#111">I</text>

  <!-- Label II: Contractile Vacuole -->
  <line x1="330" y1="180" x2="200" y2="180" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="340" y="186" font-size="19" font-weight="bold" fill="#111">II</text>

  <!-- Label III: Chloroplast -->
  <line x1="330" y1="265" x2="198" y2="265" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="340" y="271" font-size="19" font-weight="bold" fill="#111">III</text>

  <!-- Label IV: Nucleus -->
  <line x1="330" y1="355" x2="195" y2="355" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="340" y="361" font-size="19" font-weight="bold" fill="#111">IV</text>
</svg>
