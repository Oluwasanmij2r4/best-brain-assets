<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pattern for the semi-permeable membrane base -->
    <pattern id="membranePattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f0f0f0"/>
      <circle cx="5" cy="5" r="2.5" fill="#555"/>
      <circle cx="15" cy="12" r="3" fill="#333"/>
      <circle cx="8" cy="16" r="2" fill="#666"/>
      <circle cx="16" cy="4" r="1.5" fill="#444"/>
    </pattern>

    <!-- Marker for callout arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222" />
    </marker>
  </defs>

  <!-- Title / Label -->
  <text x="360" y="50" font-size="22" font-weight="bold" fill="#111">11.</text>

  <!-- Liquid inside Left Arm (Weak sugar solution) -->
  <rect x="135" y="160" width="40" height="150" fill="#cce5ff" />
  <line x1="135" y1="160" x2="175" y2="160" stroke="#004085" stroke-width="2" stroke-dasharray="3,1" />

  <!-- Liquid inside Right Arm (Strong sugar solution) -->
  <rect x="265" y="160" width="40" height="150" fill="#99caff" />
  <line x1="265" y1="160" x2="305" y2="160" stroke="#004085" stroke-width="2" stroke-dasharray="3,1" />

  <!-- Semi-permeable membrane at the bottom bend -->
  <path d="M 135 250 L 135 310 A 35 35 0 0 0 170 345 L 270 345 A 35 35 0 0 0 305 310 L 305 250 Z" 
        fill="url(#membranePattern)" stroke="#444" stroke-width="1.5" stroke-dasharray="4,2" />

  <!-- Outer Glass U-Tube -->
  <path d="M 130 90 
           L 130 310 
           A 40 40 0 0 0 170 350 
           L 270 350 
           A 40 40 0 0 0 310 310 
           L 310 90" 
        fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" />

  <!-- Inner Glass Wall of U-Tube -->
  <path d="M 180 90 
           L 180 270 
           A 10 10 0 0 0 190 280 
           L 250 280 
           A 10 10 0 0 0 260 270 
           L 260 90" 
        fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" />

  <!-- Tube Lip Rims -->
  <path d="M 125 90 C 125 85, 135 85, 135 90" fill="none" stroke="#222" stroke-width="3" />
  <path d="M 175 90 C 175 85, 185 85, 185 90" fill="none" stroke="#222" stroke-width="3" />
  <path d="M 255 90 C 255 85, 265 85, 265 90" fill="none" stroke="#222" stroke-width="3" />
  <path d="M 305 90 C 305 85, 315 85, 315 90" fill="none" stroke="#222" stroke-width="3" />

  <!-- Arm Labels: X and Y -->
  <text x="150" y="130" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">X</text>
  <text x="285" y="130" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">Y</text>

  <!-- Annotations & Pointer Lines -->
  <!-- Weak Sugar Solution (Left) -->
  <path d="M 60 250 L 130 220" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="55" y="245" font-size="13" font-weight="bold" text-anchor="end" fill="#111">Weak sugar</text>
  <text x="55" y="262" font-size="13" font-weight="bold" text-anchor="end" fill="#111">solution</text>

  <!-- Strong Sugar Solution (Right) -->
  <path d="M 370 195 L 308 195" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="375" y="190" font-size="13" font-weight="bold" fill="#111">Strong sugar</text>
  <text x="375" y="207" font-size="13" font-weight="bold" fill="#111">solution</text>

  <!-- Semi-permeable Membrane (Bottom Right) -->
  <path d="M 370 295 L 290 295" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="375" y="292" font-size="13" font-weight="bold" fill="#111">Semi-permeable</text>
  <text x="375" y="309" font-size="13" font-weight="bold" fill="#111">membrane</text>
</svg>
