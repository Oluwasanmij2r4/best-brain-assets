<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222" />
    </marker>
  </defs>

  <!-- Liquid inside Beaker (Solution Y) -->
  <rect x="50" y="210" width="200" height="190" fill="#e8f3fc" />
  <line x1="50" y1="210" x2="250" y2="210" stroke="#3182ce" stroke-width="2" />
  
  <!-- Dashed texture lines for liquid Y -->
  <g stroke="#7cb9e8" stroke-width="1.5" stroke-dasharray="10,12" stroke-linecap="round">
    <line x1="60" y1="235" x2="115" y2="235" />
    <line x1="185" y1="235" x2="240" y2="235" />
    <line x1="60" y1="265" x2="110" y2="265" />
    <line x1="190" y1="265" x2="240" y2="265" />
    <line x1="60" y1="300" x2="110" y2="300" />
    <line x1="190" y1="300" x2="240" y2="300" />
    <line x1="60" y1="335" x2="240" y2="335" />
    <line x1="60" y1="370" x2="240" y2="370" />
  </g>

  <!-- Outer Beaker Outline -->
  <path d="M 45 185 
           C 48 185, 50 190, 50 200 
           L 50 395 
           A 10 10 0 0 0 60 405 
           L 240 405 
           A 10 10 0 0 0 250 395 
           L 250 200 
           C 250 190, 252 185, 255 185" 
        fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" />

  <!-- Thistle Funnel Liquid (Solution X) -->
  <path d="M 137 140 L 137 235 
           C 120 255, 115 285, 125 315 
           L 175 315 
           C 185 285, 180 255, 163 235 
           L 163 140 Z" 
        fill="#c7e2fe" />
  <line x1="137" y1="140" x2="163" y2="140" stroke="#1d6fa5" stroke-width="2" />

  <!-- Thistle Funnel Tube Glass Body -->
  <path d="M 135 15 
           L 135 235 
           C 115 255, 110 290, 122 320 
           L 178 320 
           C 190 290, 185 255, 165 235 
           L 165 15" 
        fill="none" stroke="#222" stroke-width="2.5" />

  <!-- Membrane attached at the mouth of the thistle funnel -->
  <!-- Tied parchment / membrane cap -->
  <path d="M 115 320 Q 150 332 185 320 L 180 330 Q 150 336 120 330 Z" 
        fill="#e2d9c8" stroke="#222" stroke-width="1.5" />
  <line x1="115" y1="320" x2="185" y2="320" stroke="#a00" stroke-width="2" stroke-dasharray="3,2" />
  
  <!-- Tying band / thread around funnel neck -->
  <rect x="133" y="145" width="34" height="60" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="2,3" />

  <!-- Labels in Diagram: X and Y -->
  <text x="150" y="285" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">X</text>
  <text x="150" y="380" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">Y</text>

  <!-- Semi-permeable membrane Leader Line and Label -->
  <line x1="330" y1="325" x2="188" y2="325" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="340" y="315" font-size="16" font-weight="bold" fill="#111">Semi</text>
  <text x="340" y="335" font-size="16" font-weight="bold" fill="#111">permeable</text>
  <text x="340" y="355" font-size="16" font-weight="bold" fill="#111">membrane</text>

  <!-- Diagram Caption -->
  <text x="35" y="445" font-size="14" font-weight="bold" fill="#222">Experiment to demonstrate</text>
  <text x="35" y="465" font-size="14" font-weight="bold" fill="#222">osmosis</text>
</svg>
