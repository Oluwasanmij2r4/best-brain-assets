<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Dot marker for pointer lines -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#111" />
    </marker>
  </defs>

  <!-- Antennae extending upward (Label 1 targets left antenna base) -->
  <path d="M 195 180 C 170 140, 130 90, 85 65" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" />
  <path d="M 225 170 C 235 125, 240 90, 245 68" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" />

  <!-- Head Capsule (Cranium) -->
  <path d="M 155 205 C 150 170, 195 155, 230 160 C 255 165, 265 190, 255 220 C 245 245, 170 250, 155 205 Z" 
        fill="#eae3d2" stroke="#222" stroke-width="2.5" />

  <!-- Large Compound Eye -->
  <ellipse cx="230" cy="205" rx="22" ry="26" fill="#4a3f35" stroke="#222" stroke-width="2" />
  <!-- Reticulation / ommatidia texture lines on compound eye -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.6">
    <line x1="215" y1="195" x2="245" y2="195" />
    <line x1="212" y1="205" x2="248" y2="205" />
    <line x1="216" y1="215" x2="244" y2="215" />
    <line x1="222" y1="185" x2="222" y2="225" />
    <line x1="230" y1="182" x2="230" y2="228" />
    <line x1="238" y1="185" x2="238" y2="225" />
  </g>

  <!-- Labial Palp (Label 2) - Jointed sensory projection -->
  <path d="M 160 215 
           C 145 205, 125 185, 120 160 
           C 125 155, 133 160, 135 175 
           C 140 195, 158 215, 172 225 Z" 
        fill="#f4ecd8" stroke="#222" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Segmentation line across labial palp -->
  <line x1="124" y1="172" x2="134" y2="176" stroke="#444" stroke-width="1.8" />

  <!-- Coiled Proboscis (Label 3 / galeae of maxillae) -->
  <g fill="none" stroke="#222" stroke-linecap="round">
    <!-- Spiral coil of proboscis -->
    <path d="M 180 240 
             C 160 250, 140 275, 140 310 
             C 140 360, 180 405, 230 405 
             C 275 405, 305 370, 305 325 
             C 305 275, 260 250, 215 255 
             C 180 260, 165 295, 175 330 
             C 185 360, 220 375, 250 365 
             C 275 355, 280 325, 265 305 
             C 250 285, 220 290, 205 310 
             C 195 325, 205 342, 222 342 
             C 235 342, 242 332, 238 322" 
          stroke-width="5" />
    <!-- Fine inner channel line -->
    <path d="M 180 240 
             C 160 250, 140 275, 140 310 
             C 140 360, 180 405, 230 405 
             C 275 405, 305 370, 305 325 
             C 305 275, 260 250, 215 255 
             C 180 260, 165 295, 175 330 
             C 185 360, 220 375, 250 365" 
          stroke="#fff" stroke-width="1.5" stroke-dasharray="2,3" />
  </g>

  <!-- Caption / Subtitle -->
  <text x="50" y="440" font-size="16" font-weight="bold" fill="#222">Mouth parts of butterfly</text>

  <!-- ================= LABELS & POINTERS ================= -->
  <!-- 1: Antenna -->
  <line x1="50" y1="125" x2="160" y2="125" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="35" y="131" font-size="20" font-weight="bold" fill="#111" text-anchor="end">1</text>

  <!-- 2: Labial Palp -->
  <line x1="50" y1="175" x2="126" y2="175" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="35" y="181" font-size="20" font-weight="bold" fill="#111" text-anchor="end">2</text>

  <!-- 3: Proboscis (Coiled Maxillary Galeae) -->
  <line x1="50" y1="230" x2="170" y2="245" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="35" y="236" font-size="20" font-weight="bold" fill="#111" text-anchor="end">3</text>
</svg>
