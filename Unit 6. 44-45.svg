<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Dot Marker -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#111" />
    </marker>
  </defs>

  <!-- Ground / Background of Root Section -->
  <g id="dicot-root-cross-section">
    <!-- Root Hairs radiating outward from Piliferous layer (Epiblema) -->
    <g fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round">
      <path d="M 210 65 C 210 40, 215 35, 218 20" />
      <path d="M 130 95 C 115 80, 110 70, 105 60" />
      <path d="M 75 160 C 55 155, 45 155, 30 152" />
      <path d="M 65 240 C 45 250, 35 255, 20 262" />
      <path d="M 95 315 C 80 330, 75 340, 65 355" />
      <path d="M 155 375 C 148 395, 142 405, 138 420" />
      <path d="M 240 395 C 248 410, 255 420, 265 430" />
      <path d="M 315 365 C 335 375, 345 385, 360 395" />
      <path d="M 355 295 C 375 295, 388 295, 405 292" />
      <path d="M 350 210 C 370 200, 380 190, 395 180" />
      <path d="M 310 135 C 325 115, 335 105, 345 90" />
    </g>

    <!-- Outer Epiblema / Piliferous layer / Epidermis with root hair attached (Label II) -->
    <circle cx="210" cy="230" r="145" fill="#fcfbf9" stroke="#222" stroke-width="3" />

    <!-- Cortex Region (Broad ground tissue) -->
    <circle cx="210" cy="230" r="138" fill="#fbf9f5" stroke="#777" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Endodermis / Outer boundary of Central Stele (Label III) -->
    <circle cx="210" cy="230" r="55" fill="#f0eae1" stroke="#222" stroke-width="2.5" />

    <!-- Pericycle (Directly within Endodermis) -->
    <circle cx="210" cy="230" r="46" fill="#fbf8f2" stroke="#444" stroke-width="1.5" />

    <!-- Phloem Patches (Label I) situated between the arms of the star xylem -->
    <g fill="#1b2a4a" stroke="#111" stroke-width="1.2">
      <ellipse cx="228" cy="204" rx="7" ry="5.5" />
      <ellipse cx="236" cy="242" rx="7" ry="6" />
      <ellipse cx="192" cy="246" rx="7" ry="5.5" />
      <ellipse cx="184" cy="214" rx="7" ry="5.5" />
    </g>

    <!-- Primary Xylem (Label IV): Star-shaped central vascular tissue -->
    <path d="M 210 196 
             C 212 212, 218 218, 232 215 
             C 244 212, 248 222, 244 230 
             C 232 232, 226 238, 230 248 
             C 232 258, 222 264, 214 258 
             C 210 246, 204 246, 200 258 
             C 190 264, 182 258, 184 248 
             C 188 238, 182 232, 170 230 
             C 166 222, 170 212, 182 215 
             C 196 218, 202 212, 204 196 Z" 
          fill="#dceaf7" stroke="#1d4e89" stroke-width="2.5" />
    
    <!-- Central metaxylem vessel -->
    <circle cx="207" cy="230" r="5.5" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8" />
  </g>

  <!-- ================= LABELS & POINTERS ================= -->
  <!-- II: Epiblema / Piliferous layer (with root hairs) -->
  <line x1="390" y1="120" x2="310" y2="135" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="400" y="126" font-size="20" font-weight="bold" fill="#111">II</text>

  <!-- I: Phloem -->
  <line x1="390" y1="190" x2="238" y2="204" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="400" y="196" font-size="20" font-weight="bold" fill="#111">I</text>

  <!-- III: Endodermis / Stele boundary -->
  <line x1="390" y1="240" x2="265" y2="230" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="400" y="246" font-size="20" font-weight="bold" fill="#111">III</text>

  <!-- IV: Xylem (star-shaped central core) -->
  <line x1="390" y1="310" x2="228" y2="250" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="400" y="316" font-size="20" font-weight="bold" fill="#111">IV</text>
</svg>
