<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Dot Marker -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="3.5" fill="#111" />
    </marker>
  </defs>

  <!-- Title / Figure Caption -->
  <text x="210" y="475" font-size="14" font-weight="bold" fill="#222">Figure 3 is a section of a leaf</text>

  <!-- ================= 1. UPPER CUTICLE ================= -->
  <path d="M 80 50 Q 230 42 370 50" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" />

  <!-- ================= 2. UPPER EPIDERMIS ================= -->
  <g fill="#f7fcf5" stroke="#222" stroke-width="2">
    <!-- Barrel-shaped epidermal cells -->
    <rect x="85" y="58" width="60" height="28" rx="8" />
    <rect x="148" y="58" width="65" height="28" rx="8" />
    <rect x="216" y="58" width="65" height="28" rx="8" />
    <rect x="284" y="58" width="65" height="28" rx="8" />
  </g>

  <!-- ================= 3. PALISADE MESOPHYLL ================= -->
  <g fill="#d8eed4" stroke="#222" stroke-width="2">
    <!-- Columnar/cylindrical tightly-packed cells containing chloroplasts -->
    <rect x="105" y="90" width="30" height="75" rx="10" />
    <rect x="140" y="90" width="30" height="80" rx="10" />
    <rect x="175" y="90" width="30" height="78" rx="10" />
    <rect x="210" y="90" width="30" height="82" rx="10" />
    <rect x="245" y="90" width="30" height="76" rx="10" />
    <rect x="280" y="90" width="30" height="78" rx="10" />
    <rect x="315" y="90" width="28" height="74" rx="10" />
  </g>

  <!-- Chloroplast dots inside palisade cells -->
  <g fill="#387a2a">
    <circle cx="115" cy="105" r="2.5" /><circle cx="125" cy="120" r="2.5" /><circle cx="115" cy="140" r="2.5" /><circle cx="125" cy="155" r="2.5" />
    <circle cx="150" cy="105" r="2.5" /><circle cx="160" cy="125" r="2.5" /><circle cx="150" cy="145" r="2.5" /><circle cx="160" cy="160" r="2.5" />
    <circle cx="185" cy="105" r="2.5" /><circle cx="195" cy="125" r="2.5" /><circle cx="185" cy="145" r="2.5" /><circle cx="195" cy="160" r="2.5" />
    <circle cx="220" cy="105" r="2.5" /><circle cx="230" cy="125" r="2.5" /><circle cx="220" cy="145" r="2.5" /><circle cx="230" cy="160" r="2.5" />
    <circle cx="255" cy="105" r="2.5" /><circle cx="265" cy="125" r="2.5" /><circle cx="255" cy="145" r="2.5" /><circle cx="265" cy="160" r="2.5" />
    <circle cx="290" cy="105" r="2.5" /><circle cx="300" cy="125" r="2.5" /><circle cx="290" cy="145" r="2.5" /><circle cx="300" cy="160" r="2.5" />
  </g>

  <!-- ================= 4. VASCULAR BUNDLE (XYLEM / PHLOEM) ================= -->
  <!-- Upper vascular element / Xylem (thick-walled cells) -->
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <ellipse cx="130" cy="190" rx="14" ry="18" />
    <ellipse cx="162" cy="192" rx="16" ry="20" />
    <ellipse cx="196" cy="190" rx="15" ry="19" />
    <ellipse cx="230" cy="192" rx="16" ry="20" />
    <ellipse cx="262" cy="190" rx="14" ry="18" />
    <ellipse cx="292" cy="188" rx="14" ry="16" />
  </g>

  <!-- Vascular Bundle sheath / Phloem elements -->
  <g fill="#f8faf5" stroke="#222" stroke-width="1.8">
    <ellipse cx="150" cy="225" rx="12" ry="10" />
    <ellipse cx="175" cy="228" rx="13" ry="11" />
    <ellipse cx="205" cy="225" rx="14" ry="12" />
    <ellipse cx="235" cy="228" rx="13" ry="11" />
    <ellipse cx="260" cy="224" rx="12" ry="10" />
  </g>

  <!-- ================= 5 & 6. SPONGY MESOPHYLL & INTERCELLULAR SPACES ================= -->
  <g fill="#e4f4e0" stroke="#222" stroke-width="2">
    <!-- Loosely arranged, rounded/irregular cells with large air spaces -->
    <ellipse cx="120" cy="265" rx="16" ry="14" />
    <ellipse cx="170" cy="275" rx="18" ry="15" />
    <ellipse cx="215" cy="285" rx="20" ry="18" />
    <ellipse cx="265" cy="270" rx="18" ry="15" />
    <ellipse cx="140" cy="315" rx="17" ry="14" />
    <ellipse cx="195" cy="335" rx="20" ry="16" />
    <ellipse cx="255" cy="325" rx="19" ry="15" />
  </g>

  <!-- Chloroplast dots in spongy mesophyll -->
  <g fill="#387a2a">
    <circle cx="118" cy="265" r="2.2" /><circle cx="168" cy="272" r="2.2" /><circle cx="212" cy="285" r="2.2" />
    <circle cx="142" cy="315" r="2.2" /><circle cx="195" cy="335" r="2.2" /><circle cx="255" cy="325" r="2.2" />
  </g>

  <!-- ================= 7, 8, 9. LOWER EPIDERMIS, STOMA, GUARD CELLS ================= -->
  <!-- Left lower epidermal cells -->
  <rect x="80" y="360" width="40" height="26" rx="8" fill="#f7fcf5" stroke="#222" stroke-width="2" />
  
  <!-- Stomatal Complex -->
  <!-- Left Guard Cell (Label 9) -->
  <path d="M 130 360 C 138 360, 142 368, 142 373 C 142 378, 138 386, 130 386 C 122 386, 122 360, 130 360 Z" 
        fill="#b8e2b2" stroke="#222" stroke-width="2" />
  
  <!-- Right Guard Cell -->
  <path d="M 152 360 C 144 360, 140 368, 140 373 C 140 378, 144 386, 152 386 C 160 386, 160 360, 152 360 Z" 
        fill="#b8e2b2" stroke="#222" stroke-width="2" />

  <!-- Stomatal pore/aperture (Label 8) -->
  <ellipse cx="141" cy="373" rx="1.5" ry="5" fill="#111" />

  <!-- Right lower epidermal cells (Label 7) -->
  <rect x="165" y="360" width="55" height="26" rx="8" fill="#f7fcf5" stroke="#222" stroke-width="2" />
  <rect x="225" y="360" width="55" height="26" rx="8" fill="#f7fcf5" stroke="#222" stroke-width="2" />

  <!-- Lower Cuticle -->
  <path d="M 80 392 L 125 392 M 158 392 L 285 392" fill="none" stroke="#222" stroke-width="2" />

  <!-- ================= POINTERS AND LABELS ================= -->
  <!-- 1: Upper Cuticle -->
  <line x1="390" y1="50" x2="350" y2="50" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="400" y="55" font-size="16" font-weight="bold" fill="#111">1</text>

  <!-- 2: Upper Epidermis -->
  <line x1="390" y1="72" x2="340" y2="72" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="400" y="77" font-size="16" font-weight="bold" fill="#111">2</text>

  <!-- 3: Palisade Mesophyll Layer -->
  <line x1="390" y1="125" x2="335" y2="125" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="400" y="130" font-size="16" font-weight="bold" fill="#111">3</text>

  <!-- 4: Vascular Bundle / Xylem -->
  <line x1="390" y1="190" x2="295" y2="190" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="400" y="195" font-size="16" font-weight="bold" fill="#111">4</text>

  <!-- 5: Spongy Mesophyll / Intercellular Air Space -->
  <line x1="390" y1="260" x2="275" y2="260" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="400" y="265" font-size="16" font-weight="bold" fill="#111">5</text>

  <!-- 6: Spongy Mesophyll Cell -->
  <line x1="390" y1="325" x2="270" y2="325" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="400" y="330" font-size="16" font-weight="bold" fill="#111">6</text>

  <!-- 7: Lower Epidermis -->
  <line x1="220" y1="425" x2="220" y2="388" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="215" y="445" font-size="16" font-weight="bold" fill="#111">7</text>

  <!-- 8: Stoma / Stomatal Pore -->
  <line x1="148" y1="425" x2="142" y2="382" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="144" y="445" font-size="16" font-weight="bold" fill="#111">8</text>

  <!-- 9: Guard Cell -->
  <line x1="125" y1="425" x2="130" y2="388" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="120" y="445" font-size="16" font-weight="bold" fill="#111">9</text>
</svg>
