<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Dot Marker -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#111" />
    </marker>
  </defs>

  <!-- Head of Housefly (Lateral View) -->
  <g id="housefly-head">
    <!-- Posterior Head Bristles & Occipital Region -->
    <g fill="none" stroke="#222" stroke-linecap="round">
      <!-- Upper / Vertex Bristle -->
      <path d="M 170 100 C 130 90, 110 110, 100 120" stroke-width="2.5" />
      <path d="M 160 135 C 135 130, 125 155, 115 170" stroke-width="2.2" />
      <!-- Lower Occipital Bristles -->
      <path d="M 175 190 C 150 205, 130 250, 115 280" stroke-width="2.5" />
      <path d="M 135 240 C 120 260, 105 290, 95 305" stroke-width="2" />
      <path d="M 140 270 C 130 295, 130 315, 125 330" stroke-width="1.8" />
    </g>

    <!-- Head Capsule (Lateral contour) -->
    <path d="M 185 85 
             C 220 70, 275 80, 280 135 
             C 285 185, 260 250, 225 260 
             L 190 245 
             C 165 220, 160 140, 185 85 Z" 
          fill="#eddcc9" stroke="#222" stroke-width="2.8" />

    <!-- Compound Eye (Dark kidney-shaped lateral area - Label I) -->
    <path d="M 198 105 
             C 230 90, 260 105, 262 145 
             C 265 190, 245 225, 222 230 
             C 200 232, 188 190, 192 150 
             C 194 125, 190 115, 198 105 Z" 
          fill="#3b2b20" stroke="#111" stroke-width="2" />

    <!-- Antenna with Arista (Label II) -->
    <!-- 3-segmented drooping antenna -->
    <path d="M 270 125 
             C 285 135, 305 160, 290 185 
             C 280 190, 275 170, 275 155 Z" 
          fill="#cfbca8" stroke="#222" stroke-width="2" />
    <!-- Feathery Arista branching outward -->
    <path d="M 278 135 C 295 135, 320 145, 340 152" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 292 138 C 305 150, 315 165, 325 175" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" />
    <!-- Small sensory maxillary palp at base of rostrum -->
    <path d="M 268 200 C 295 205, 315 210, 325 210" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round" />

    <!-- Retractile Proboscis (Label III) -->
    <!-- Basal Rostrum -->
    <path d="M 200 255 L 200 295 L 230 295 L 232 255 Z" 
          fill="#ded0be" stroke="#222" stroke-width="2.2" />
    
    <!-- Middle Haustellum -->
    <path d="M 200 295 
             C 195 320, 210 350, 220 375 
             L 248 365 
             C 240 335, 230 315, 230 295 Z" 
          fill="#e4d7c6" stroke="#222" stroke-width="2.5" />
    <line x1="210" y1="305" x2="225" y2="368" stroke="#777" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Distal Labellum (Sponging Pad / Pseudotracheae lobes) -->
    <path d="M 205 385 
             C 185 390, 185 415, 210 420 
             C 240 425, 285 425, 305 410 
             C 315 400, 300 380, 275 380 
             C 255 380, 235 375, 205 385 Z" 
          fill="#cfbaa3" stroke="#222" stroke-width="2.5" />
    
    <!-- Grooves representing Pseudotracheae channels on labellum -->
    <g stroke="#222" stroke-width="1.5" fill="none">
      <path d="M 215 392 Q 225 410 240 415" />
      <path d="M 235 390 Q 248 410 262 414" />
      <path d="M 255 388 Q 268 405 285 408" />
    </g>
  </g>

  <!-- ================= LABELS & POINTERS ================= -->
  <!-- I: Compound Eye -->
  <line x1="370" y1="125" x2="258" y2="125" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="385" y="132" font-size="22" font-weight="bold" fill="#111">I</text>

  <!-- II: Antenna / Arista -->
  <line x1="370" y1="190" x2="310" y2="190" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="385" y="197" font-size="22" font-weight="bold" fill="#111">II</text>

  <!-- III: Proboscis (Haustellum / Labium) -->
  <line x1="370" y1="365" x2="242" y2="365" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="385" y="372" font-size="22" font-weight="bold" fill="#111">III</text>
</svg>
