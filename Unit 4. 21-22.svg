<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Internal cytoplasm texture pattern -->
    <pattern id="endoPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#555" />
      <circle cx="12" cy="11" r="1.2" fill="#777" />
      <circle cx="13" cy="3" r="1" fill="#444" />
      <circle cx="5" cy="13" r="1.5" fill="#666" />
    </pattern>
  </defs>

  <!-- Paramecium Cilia fringe -->
  <path d="M 90 190 C 70 140, 110 80, 200 65 C 310 50, 425 80, 435 125 C 445 165, 395 205, 305 220 C 205 235, 110 230, 90 190 Z" 
        fill="none" stroke="#666" stroke-width="6" stroke-dasharray="2,3" />

  <!-- Pellicle & Main Body Outline -->
  <path d="M 90 190 C 70 140, 110 80, 200 65 C 310 50, 425 80, 435 125 C 445 165, 395 205, 305 220 C 205 235, 110 230, 90 190 Z" 
        fill="#eef2f7" stroke="#222" stroke-width="3" />

  <!-- Endoplasm fill -->
  <path d="M 98 185 C 80 145, 118 90, 200 75 C 305 60, 415 90, 425 127 C 435 160, 385 197, 302 212 C 205 225, 118 220, 98 185 Z" 
        fill="url(#endoPattern)" />

  <!-- Oral Groove / Cytostome depression -->
  <path d="M 230 70 C 215 95, 205 120, 235 145 C 248 158, 260 162, 275 162" 
        fill="none" stroke="#222" stroke-width="2.5" />
  
  <!-- Food Vacuoles inside cytoplasm -->
  <circle cx="140" cy="170" r="10" fill="#fff" stroke="#222" stroke-width="2" />
  <circle cx="180" cy="180" r="12" fill="#fff" stroke="#222" stroke-width="2" />
  <circle cx="340" cy="115" r="9" fill="#fff" stroke="#222" stroke-width="2" />
  <circle cx="370" cy="140" r="11" fill="#fff" stroke="#222" stroke-width="2" />
  <circle cx="395" cy="120" r="8" fill="#fff" stroke="#222" stroke-width="2" />

  <!-- Macronucleus (Large kidney/bean shape) - Label Y Target -->
  <path d="M 235 110 C 235 90, 275 88, 290 102 C 305 115, 305 135, 290 142 C 272 150, 245 145, 235 110 Z" 
        fill="#333" stroke="#111" stroke-width="2" />
  
  <!-- Micronucleus nested adjacent -->
  <circle cx="282" cy="96" r="4.5" fill="#111" />

  <!-- Contractile Vacuoles with radial canals -->
  <!-- Anterior Contractile Vacuole -->
  <circle cx="160" cy="115" r="7" fill="#fff" stroke="#222" stroke-width="1.5" />
  <!-- Posterior Contractile Vacuole -->
  <circle cx="350" cy="165" r="7" fill="#fff" stroke="#222" stroke-width="1.5" />

  <!-- Pointer and Label for X (pointing to Gullet / Cytopharynx) -->
  <line x1="205" y1="285" x2="235" y2="155" stroke="#111" stroke-width="2" />
  <circle cx="235" cy="155" r="3" fill="#111" />
  <text x="190" y="305" font-size="20" font-weight="bold" fill="#111">X</text>

  <!-- Pointer and Label for Y (pointing to Macronucleus / Nucleus) -->
  <line x1="275" y1="35" x2="265" y2="105" stroke="#111" stroke-width="2" />
  <circle cx="265" cy="105" r="3" fill="#111" />
  <text x="280" y="35" font-size="20" font-weight="bold" fill="#111">Y</text>
</svg>
