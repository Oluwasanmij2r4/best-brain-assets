<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Dot Marker -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#111" />
    </marker>
  </defs>

  <!-- Cilia Border around the Paramecium body -->
  <path d="M 40 180 
           C 60 145, 120 120, 240 115 
           C 360 110, 460 125, 475 160 
           C 490 195, 430 225, 360 230 
           C 270 235, 230 265, 170 255 
           C 90 245, 25 210, 40 180 Z" 
        fill="none" stroke="#666" stroke-width="6" stroke-dasharray="2,3" />

  <!-- Outer Pellicle Boundary -->
  <path d="M 40 180 
           C 60 145, 120 120, 240 115 
           C 360 110, 460 125, 475 160 
           C 490 195, 430 225, 360 230 
           C 270 235, 230 265, 170 255 
           C 90 245, 25 210, 40 180 Z" 
        fill="#f8faff" stroke="#222" stroke-width="2.5" />

  <!-- Oral Groove / Cytostome -->
  <path d="M 330 228 
           C 270 225, 220 200, 180 200 
           C 150 200, 140 215, 170 240" 
        fill="none" stroke="#222" stroke-width="2" />
  
  <!-- Cilia lines along the oral groove -->
  <g stroke="#555" stroke-width="1.2">
    <line x1="280" y1="223" x2="280" y2="213" />
    <line x1="265" y1="219" x2="265" y2="209" />
    <line x1="250" y1="215" x2="250" y2="205" />
    <line x1="235" y1="211" x2="235" y2="201" />
    <line x1="220" y1="207" x2="220" y2="197" />
  </g>

  <!-- Cytoplasmic texture lines in oral region -->
  <g stroke="#999" stroke-width="1" stroke-dasharray="3,3">
    <line x1="160" y1="220" x2="220" y2="220" />
    <line x1="170" y1="230" x2="230" y2="230" />
    <line x1="180" y1="240" x2="220" y2="240" />
  </g>

  <!-- Posterior Contractile Vacuole (left side) with radial canals -->
  <g stroke="#222" stroke-width="1.8">
    <circle cx="120" cy="180" r="8" fill="#fff" />
    <!-- Radiating canals -->
    <line x1="120" y1="172" x2="120" y2="162" />
    <line x1="120" y1="188" x2="120" y2="198" />
    <line x1="112" y1="180" x2="102" y2="180" />
    <line x1="128" y1="180" x2="138" y2="180" />
    <line x1="114" y1="174" x2="107" y2="167" />
    <line x1="126" y1="186" x2="133" y2="193" />
    <line x1="114" y1="186" x2="107" y2="193" />
    <line x1="126" y1="174" x2="133" y2="167" />
  </g>

  <!-- Anterior Contractile Vacuole (right side) with radial canals — Label IV -->
  <g id="contractile-vacuole-IV" stroke="#222" stroke-width="1.8">
    <circle cx="395" cy="165" r="9" fill="#fff" />
    <!-- Radiating canals -->
    <line x1="395" y1="156" x2="395" y2="144" />
    <line x1="395" y1="174" x2="395" y2="186" />
    <line x1="386" y1="165" x2="374" y2="165" />
    <line x1="404" y1="165" x2="416" y2="165" />
    <line x1="389" y1="159" x2="380" y2="150" />
    <line x1="401" y1="171" x2="410" y2="180" />
    <line x1="389" y1="171" x2="380" y2="180" />
    <line x1="401" y1="159" x2="410" y2="150" />
  </g>

  <!-- Food Vacuoles -->
  <!-- Target for Label I -->
  <circle cx="180" cy="155" r="7.5" fill="#fff" stroke="#222" stroke-width="1.5" />
  <circle cx="330" cy="150" r="5.5" fill="#fff" stroke="#222" stroke-width="1.5" />
  <circle cx="350" cy="165" r="6" fill="#fff" stroke="#222" stroke-width="1.5" />
  <circle cx="335" cy="180" r="5" fill="#fff" stroke="#222" stroke-width="1.5" />

  <!-- Macronucleus (Large bean shape) — Label II -->
  <path d="M 235 155 
           C 235 140, 260 135, 275 145 
           C 285 155, 280 185, 265 185 
           C 245 185, 235 170, 235 155 Z" 
        fill="#f0ece1" stroke="#222" stroke-width="2" />

  <!-- Micronucleus (Small spherical body fitted in indentation) — Label III -->
  <circle cx="265" cy="178" r="5.5" fill="#222" />

  <!-- Pointer I (pointing to Food Vacuole) -->
  <line x1="180" y1="75" x2="180" y2="147" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="180" y="65" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">I</text>

  <!-- Pointer II (pointing to Macronucleus) -->
  <line x1="260" y1="75" x2="260" y2="152" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="260" y="65" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">II</text>

  <!-- Pointer III (pointing to Micronucleus) -->
  <line x1="320" y1="75" x2="271" y2="176" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="320" y="65" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">III</text>

  <!-- Pointer IV (pointing to Contractile Vacuole) -->
  <line x1="480" y1="165" x2="405" y2="165" stroke="#111" stroke-width="2" marker-end="url(#dot)" />
  <text x="490" y="172" font-size="20" font-weight="bold" fill="#111">IV</text>
</svg>
