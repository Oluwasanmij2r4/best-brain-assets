<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pattern for the rough, warty zygospore wall -->
    <pattern id="wartyTexture" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.5" fill="#2b1d0c" />
      <circle cx="14" cy="12" r="3" fill="#1f1408" />
      <circle cx="6" cy="14" r="2" fill="#3d2a14" />
      <circle cx="13" cy="4" r="1.8" fill="#4a341b" />
    </pattern>

    <!-- Marker for label pointers -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#111" />
    </marker>
  </defs>

  <!-- Left Suspensor Hypha -->
  <path d="M 125 240 
           C 115 190, 140 135, 195 125 
           L 205 175 
           C 165 185, 145 210, 140 240 Z" 
        fill="#f4ecd8" stroke="#222" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Left Septum (cross-wall separating suspensor from gametangium remnant) -->
  <line x1="195" y1="125" x2="205" y2="175" stroke="#444" stroke-width="2" stroke-dasharray="2,2" />

  <!-- Right Suspensor Hypha -->
  <path d="M 375 230 
           C 385 180, 360 125, 305 115 
           L 295 165 
           C 335 175, 355 200, 360 230 Z" 
        fill="#f4ecd8" stroke="#222" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Right Septum -->
  <line x1="305" y1="115" x2="295" y2="165" stroke="#444" stroke-width="2" stroke-dasharray="2,2" />

  <!-- Zygospore Body (Rough, thick-walled, warty central sphere) -->
  <!-- Base background silhouette with irregular warty bumps -->
  <path d="M 250 85 
           C 285 82, 310 95, 325 115 
           C 345 138, 340 170, 325 195 
           C 305 220, 275 230, 245 228 
           C 210 225, 180 215, 168 185 
           C 155 155, 170 120, 195 100 
           C 215 86, 235 87, 250 85 Z" 
        fill="#5c3e21" stroke="#222" stroke-width="3" />

  <!-- Warty overlay pattern fill -->
  <path d="M 250 85 
           C 285 82, 310 95, 325 115 
           C 345 138, 340 170, 325 195 
           C 305 220, 275 230, 245 228 
           C 210 225, 180 215, 168 185 
           C 155 155, 170 120, 195 100 
           C 215 86, 235 87, 250 85 Z" 
        fill="url(#wartyTexture)" />

  <!-- Outer tuberculate/warty ridges -->
  <g fill="#2b1d0c" stroke="#1f1408" stroke-width="1">
    <circle cx="185" cy="115" r="7" />
    <circle cx="215" cy="98" r="8" />
    <circle cx="250" cy="92" r="7.5" />
    <circle cx="285" cy="96" r="8" />
    <circle cx="318" cy="120" r="7" />
    <circle cx="330" cy="155" r="8.5" />
    <circle cx="315" cy="188" r="8" />
    <circle cx="280" cy="215" r="7.5" />
    <circle cx="240" cy="222" r="8.5" />
    <circle cx="200" cy="210" r="7" />
    <circle cx="172" cy="175" r="8" />
    <circle cx="170" cy="140" r="7.5" />
    <!-- Internal warts -->
    <circle cx="225" cy="140" r="9" />
    <circle cx="265" cy="135" r="10" />
    <circle cx="240" cy="175" r="9.5" />
    <circle cx="280" cy="170" r="8.5" />
  </g>

  <!-- Pointer and Label I (pointing to Zygospore) -->
  <line x1="250" y1="40" x2="250" y2="85" stroke="#111" stroke-width="2.5" marker-end="url(#dot)" />
  <text x="250" y="32" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">I</text>

  <!-- Pointer and Label II (pointing to Suspensor) -->
  <line x1="85" y1="238" x2="132" y2="238" stroke="#111" stroke-width="2.5" marker-end="url(#dot)" />
  <text x="75" y="244" font-size="20" font-weight="bold" fill="#111" text-anchor="end">II</text>
</svg>
