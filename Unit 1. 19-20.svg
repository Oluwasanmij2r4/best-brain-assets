<svg viewBox="0 0 380 340" xmlns="http://www.w3.org/2000/svg" style="background:#fcfdfd; border:1px solid #d1d5db; border-radius:8px; font-family:sans-serif;">
  <!-- Irregular Animal Cell Outline (IV: Cell membrane) -->
  <path d="M 80,60 C 130,45 200,45 230,60 C 255,80 255,240 240,280 C 200,300 110,300 80,270 C 65,220 65,100 80,60 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Centrally Placed Nucleus -->
  <circle cx="155" cy="175" r="38" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <!-- Nucleolus (III) -->
  <circle cx="168" cy="182" r="10" fill="#0f172a"/>

  <!-- Endoplasmic Reticulum / Golgi network (I) -->
  <path d="M 115,105 C 130,85 180,85 200,105 M 125,120 C 145,100 175,100 190,120 M 155,85 L 155,65" fill="none" stroke="#334155" stroke-width="2.5"/>
  <path d="M 120,240 C 140,225 180,225 195,240 M 130,255 C 145,245 175,245 185,255" fill="none" stroke="#334155" stroke-width="2.5"/>

  <!-- Mitochondria / Cytoplasmic Granules (II) -->
  <ellipse cx="215" cy="145" rx="7" ry="4" fill="#0f172a"/>
  <ellipse cx="95" cy="155" rx="8" ry="4" transform="rotate(-40 95 155)" fill="#0f172a"/>
  <circle cx="105" cy="95" r="3" fill="#0f172a"/>
  <circle cx="215" cy="95" r="3" fill="#0f172a"/>
  <circle cx="215" cy="210" r="3" fill="#0f172a"/>

  <!-- Pointer I -> Endoplasmic Reticulum -->
  <line x1="195" y1="105" x2="295" y2="105" stroke="#111" stroke-width="1.2"/>
  <text x="305" y="110" font-size="16" font-weight="bold">I</text>

  <!-- Pointer II -> Mitochondria / Cytoplasm granule -->
  <line x1="222" y1="145" x2="295" y2="145" stroke="#111" stroke-width="1.2"/>
  <text x="305" y="150" font-size="16" font-weight="bold">II</text>

  <!-- Pointer III -> Nucleolus -->
  <line x1="178" y1="182" x2="295" y2="182" stroke="#111" stroke-width="1.2"/>
  <text x="305" y="187" font-size="16" font-weight="bold">III</text>

  <!-- Pointer IV -> Cell Membrane -->
  <line x1="240" y1="240" x2="295" y2="240" stroke="#111" stroke-width="1.2"/>
  <text x="305" y="245" font-size="16" font-weight="bold">IV</text>
</svg>
