<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pointer Dot Marker -->
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#111" />
    </marker>
  </defs>

  <!-- ================= 1. UPPER CUTICLE (LABEL I) ================= -->
  <path d="M 50 65 Q 160 58 270 65" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" />

  <!-- ================= 2. UPPER EPIDERMIS ================= -->
  <g fill="#f8faf6" stroke="#222" stroke-width="2">
    <rect x="52" y="73" width="40" height="25" rx="6" />
    <rect x="94" y="73" width="42" height="25" rx="6" />
    <rect x="138" y="73" width="42" height="25" rx="6" />
    <rect x="182" y="73" width="42" height="25" rx="6" />
    <rect x="226" y="73" width="42" height="25" rx="6" />
  </g>

  <!-- ================= 3. PALISADE MESOPHYLL ================= -->
  <g fill="#d8edd5" stroke="#222" stroke-width="2">
    <rect x="65" y="102" width="22" height="60" rx="8" />
    <rect x="91" y="102" width="22" height="64" rx="8" />
    <rect x="117" y="102" width="22" height="62" rx="8" />
    <rect x="143" y="102" width="22" height="65" rx="8" />
    <rect x="169" y="102" width="22" height="60" rx="8" />
    <rect x="195" y="102" width="22" height="63" rx="8" />
    <rect x="221" y="102" width="22" height="61" rx="8" />
    <rect x="247" y="102" width="20" height="58" rx="8" />
  </g>

  <!-- Chloroplasts in Palisade Layer -->
  <g fill="#2e7d32">
    <circle cx="76" cy="115" r="2.2" /><circle cx="76" cy="130" r="2.2" /><circle cx="76" cy="148" r="2.2" />
    <circle cx="102" cy="118" r="2.2" /><circle cx="102" cy="135" r="2.2" /><circle cx="102" cy="152" r="2.2" />
    <circle cx="128" cy="116" r="2.2" /><circle cx="128" cy="133" r="2.2" /><circle cx="128" cy="150" r="2.2" />
    <circle cx="154" cy="118" r="2.2" /><circle cx="154" cy="136" r="2.2" /><circle cx="154" cy="154" r="2.2" />
    <circle cx="180" cy="115" r="2.2" /><circle cx="180" cy="132" r="2.2" /><circle cx="180" cy="149" r="2.2" />
    <circle cx="206" cy="117" r="2.2" /><circle cx="206" cy="134" r="2.2" /><circle cx="206" cy="151" r="2.2" />
    <circle cx="232" cy="115" r="2.2" /><circle cx="232" cy="133" r="2.2" /><circle cx="232" cy="150" r="2.2" />
    <circle cx="257" cy="116" r="2.2" /><circle cx="257" cy="132" r="2.2" /><circle cx="257" cy="148" r="2.2" />
  </g>

  <!-- ================= 4. SPONGY MESOPHYLL & SUB-STOMATAL CAVITY ================= -->
  <!-- Upper row of spongy cells -->
  <g fill="#e5f4e3" stroke="#222" stroke-width="1.8">
    <ellipse cx="75" cy="180" rx="14" ry="12" />
    <ellipse cx="108" cy="184" rx="13" ry="11" />
    <ellipse cx="140" cy="180" rx="14" ry="11" />
    <ellipse cx="172" cy="184" rx="12" ry="10" />
    <ellipse cx="202" cy="180" rx="13" ry="11" />
    <ellipse cx="235" cy="184" rx="14" ry="12" />
    <ellipse cx="260" cy="180" rx="11" ry="10" />

    <!-- Looser Spongy Mesophyll column on the left -->
    <ellipse cx="85" cy="205" rx="12" ry="10" />
    
    <!-- Spongy Mesophyll Cells bordering Sub-stomatal Chamber (LABEL II) -->
    <ellipse cx="230" cy="210" rx="11" ry="10" />
    <ellipse cx="225" cy="235" rx="12" ry="11" />
    <ellipse cx="222" cy="262" rx="11" ry="10" />
    <ellipse cx="218" cy="288" rx="10" ry="9" />
  </g>

  <!-- ================= 5. LOWER EPIDERMIS & STOMATAL APPARATUS ================= -->
  <!-- Left lower epidermal cells -->
  <g fill="#f8faf6" stroke="#222" stroke-width="2">
    <rect x="50" y="270" width="36" height="22" rx="5" />
    <rect x="88" y="270" width="38" height="22" rx="5" />
    <ellipse cx="98" cy="254" rx="12" ry="9" fill="#e5f4e3" />
    <rect x="128" y="275" width="38" height="22" rx="5" />
  </g>

  <!-- Sunken Guard Cells forming Stoma (LABEL IV) -->
  <g stroke="#222" stroke-width="2">
    <!-- Left Guard Cell -->
    <ellipse cx="168" cy="308" rx="8" ry="12" fill="#bfe6ba" transform="rotate(35 168 308)" />
    <!-- Right Guard Cell -->
    <ellipse cx="184" cy="308" rx="8" ry="12" fill="#bfe6ba" transform="rotate(-35 184 308)" />
    <!-- Stomatal Aperture / Pore -->
    <ellipse cx="176" cy="310" rx="2" ry="6" fill="#111" />
  </g>

  <!-- Right Lower Epidermal Cells (LABEL III) -->
  <g fill="#f8faf6" stroke="#222" stroke-width="2">
    <rect x="194" y="278" width="34" height="24" rx="6" />
    <rect x="230" y="278" width="38" height="24" rx="6" />
  </g>

  <!-- Lower Cuticle -->
  <path d="M 50 294 L 140 299 L 160 318 M 190 318 L 210 304 L 270 304" fill="none" stroke="#222" stroke-width="2" />

  <!-- ================= LABELS & POINTERS ================= -->
  <!-- I: Cuticle (uppermost waxy layer) -->
  <path d="M 370 95 L 240 95 L 225 67" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="380" y="102" font-size="22" font-weight="bold" fill="#111">I</text>

  <!-- II: Spongy Mesophyll Cell -->
  <line x1="370" y1="235" x2="238" y2="235" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="380" y="242" font-size="22" font-weight="bold" fill="#111">II</text>

  <!-- III: Lower Epidermis -->
  <line x1="370" y1="290" x2="265" y2="290" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="380" y="297" font-size="22" font-weight="bold" fill="#111">III</text>

  <!-- IV: Stoma / Guard Cells -->
  <line x1="370" y1="340" x2="182" y2="315" stroke="#111" stroke-width="1.8" marker-end="url(#dot)" />
  <text x="380" y="348" font-size="22" font-weight="bold" fill="#111">IV</text>
</svg>
